templates:
    0: &manual
        type: float
        subgrades:
            punten: integer
            dag_te_laat: boolean
            vier_dagen_te_laat: boolean
            veel_te_laat: boolean
        hide_subgrades: false
        hide_calculated: false

    1: &manual_discuss
        type: float
        subgrades:
            punten: integer
            dag_te_laat: boolean
            vier_dagen_te_laat: boolean
            veel_te_laat: boolean
            afgetekend: boolean
        hide_subgrades: false
        hide_calculated: false

    2: &manual_exam
        type: float
        subgrades:
            punten: integer
        calculation: punten * 9.0 / 54.0 + 1.0
        is_test: true

    3: &participation_check
        type: float
        subgrades:
            punten: integer
        calculation: punten * 9.0 / 3.0 + 1.0
        is_test: true

grades:
    knn:
        <<: *manual_discuss
        calculation: "afgetekend == -1 && [(punten) * 9.0 / 23 + 1, veel_te_laat == -1 && 1 || 10, dag_te_laat == -1 && 7 || 10, vier_dagen_te_laat == -1 && 5.5 || 10].min || 0"
        deadline: 04/02/26 23:59
    
    evaluation:
        <<: *manual
        calculation: "[(punten) * 9.0 / 11 + 1, veel_te_laat == -1 && 1 || 10, dag_te_laat == -1 && 7 || 10, vier_dagen_te_laat == -1 && 5.5 || 10].min"
        deadline: 06/02/26 23:59

    real_data:
        <<: *manual
        calculation: "[(punten) * 9.0 / 18 + 1, veel_te_laat == -1 && 1 || 10, dag_te_laat == -1 && 7 || 10, vier_dagen_te_laat == -1 && 5.5 || 10].min"
        deadline: 11/02/26 23:59

    tf-idf:
        <<: *manual_discuss
        calculation: "afgetekend == -1 && [(punten) * 9.0 / 24 + 1, veel_te_laat == -1 && 1 || 10, dag_te_laat == -1 && 7 || 10, vier_dagen_te_laat == -1 && 5.5 || 10].min || 0"
        deadline: 13/02/26 23:59

    word2vec:
        <<: *manual
        calculation: "[(punten) * 9.0 / 11 + 1, veel_te_laat == -1 && 1 || 10, dag_te_laat == -1 && 7 || 10, vier_dagen_te_laat == -1 && 5.5 || 10].min"
        deadline: 18/02/26 23:59

    jaccard:
        <<: *manual
        calculation: "[(punten) * 9.0 / 6 + 1, veel_te_laat == -1 && 1 || 10, dag_te_laat == -1 && 7 || 10, vier_dagen_te_laat == -1 && 5.5 || 10].min"
        deadline: 20/02/26 23:59

    matrices:
        <<: *manual
        calculation: "[(punten) * 9.0 / 10 + 1, veel_te_laat == -1 && 1 || 10, dag_te_laat == -1 && 7 || 10, vier_dagen_te_laat == -1 && 5.5 || 10].min"
        deadline: 25/02/26 23:59

    factorisatie:
        <<: *manual_discuss
        calculation: "afgetekend == -1 && [(punten) * 9.0 / 33 + 1, veel_te_laat == -1 && 1 || 10, dag_te_laat == -1 && 7 || 10, vier_dagen_te_laat == -1 && 5.5 || 10].min || 0"
        deadline: 27/02/26 23:59

    diversity:
        <<: *manual_discuss
        calculation: "[(punten) * 9.0 / 23 + 1, veel_te_laat == -1 && 1 || 10, dag_te_laat == -1 && 7 || 10, vier_dagen_te_laat == -1 && 5.5 || 10].min"
        deadline: 4/03/26 23:59


    presentation_bias:
        type: float
        subgrades:
            aanwezig: boolean
            serieus_gedaan: boolean
        calculation: "serieus_gedaan == -1 && 10 || 1"
        hide_subgrades: false
        hide_calculated: true

    presentation_nrs:
        type: float
        subgrades:
            aanwezig: boolean
            serieus_gedaan: boolean
        calculation: "serieus_gedaan == -1 && 10 || 1"
        hide_subgrades: false
        hide_calculated: true

    debat:
        type: float
        subgrades:
            aanwezig: boolean
            serieus_gedaan: boolean
            goed_gedaan: boolean
        calculation: "goed_gedaan == -1 && 10.0 || (serieus_gedaan == -1 && 7.0 || (aanwezig == -1 && 1.0 || 0))"
        hide_subgrades: false
        hide_calculated: true

    final_pres_participation:
        type: float
        subgrades:
            aanwezig: boolean
            serieus_gedaan: boolean
        calculation: "serieus_gedaan == -1 && 10 || 1"
        hide_subgrades: false
        hide_calculated: true

    eindproject:
        type: float
        subgrades:
            technische_kwaliteit: integer
            kritische_reflectie: integer
            integratie: integer
            presentatie: integer
        calculation: "1 + (technische_kwaliteit * 3 + kritische_reflectie * 3 + integratie * 2 + presentatie * 2) * 9 / 40"
        is_test: true     

    tentamen: *manual_exam
    hertentamen: *manual_exam

    

programmeeropdrachten:
    show_progress: true
    submits:
        knn: 1
        evaluation: 1
        real_data: 1
        tf-idf: 1
        word2vec: 1
        jaccard: 1
        matrices: 1
        factorisatie: 1
        diversity: 1
        
participatie:
    show_progress: true
    submits:
        presentation_bias: 1
        presentation_nrs: 1
        debat: 3
        final_pres_participation: 2

eindproject:
    show_progress: true
    submits:
        eindproject: 1
        
tentamen:
    show_progress: true
    minimum: 5.5
    submits:
        tentamen: 1
  
hertentamen:
    show_progress: true
    minimum: 5.5
    submits:
        tentamen: 1

calculation:
    eindcijfer:
        programmeeropdrachten: 25
        participatie: 10
        eindproject: 25
        tentamen: 40
    herkansingscijfer:
        programmeeropdrachten: 25
        participatie: 10
        eindproject: 25
        hertentamen: 40

